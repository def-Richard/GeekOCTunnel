[package]
name = "geekoctunnel"
version = "0.1.0"
description = "GeekOCTunnel desktop development preview"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
flate2 = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
sha2 = "0.10"
flate2 = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "blocking-api"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
